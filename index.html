<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub 저장소 검색</title>
  <style>
    /* 전체 페이지 기본 스타일 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* 페이지 제목 영역 */
    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 2rem;
      color: #24292f;
    }

    header p {
      margin-top: 8px;
      color: #666;
      font-size: 0.95rem;
    }

    /* 검색 폼 영역 */
    .search-form {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 40px;
    }

    .search-form input {
      width: 320px;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-form input:focus {
      border-color: #0969da;
    }

    .search-form button {
      padding: 12px 24px;
      font-size: 1rem;
      background-color: #0969da;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .search-form button:hover {
      background-color: #0550ae;
    }

    /* 로딩 메시지 */
    #loading {
      text-align: center;
      color: #666;
      font-size: 1rem;
      display: none;
    }

    /* 에러 메시지 */
    #error-message {
      text-align: center;
      color: #d1242f;
      font-size: 0.95rem;
      display: none;
      margin-bottom: 16px;
    }

    /* 결과 카드 목록 */
    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* 개별 저장소 카드 */
    .card {
      background-color: #fff;
      border: 1px solid #d0d7de;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: box-shadow 0.2s;
    }

    .card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    /* 저장소 이름 링크 */
    .card-title a {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0969da;
      text-decoration: none;
    }

    .card-title a:hover {
      text-decoration: underline;
    }

    /* 저장소 설명 */
    .card-description {
      font-size: 0.9rem;
      color: #555;
      line-height: 1.5;
      flex-grow: 1;
    }

    /* 언어 & star 정보 */
    .card-meta {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
      color: #666;
    }

    .card-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🔍 GitHub 저장소 검색</h1>
    <p>검색어를 입력하면 ⭐ stars 순으로 상위 6개 저장소를 보여줍니다.</p>
  </header>

  <!-- 검색 입력 폼 -->
  <div class="search-form">
    <input
      type="text"
      id="keyword-input"
      placeholder="검색어를 입력하세요 (예: react)"
    />
    <button onclick="handleSearch()">검색</button>
  </div>

  <!-- 로딩 상태 표시 -->
  <p id="loading">⏳ 검색 중...</p>

  <!-- 에러 메시지 표시 -->
  <p id="error-message"></p>

  <!-- 검색 결과 카드 목록 -->
  <div id="results"></div>

  <script>
    // ① GitHub 저장소 검색 URL을 만드는 함수
    function buildSearchUrl(keyword) {
      // encodeURIComponent: 공백이나 특수문자를 URL에서 사용할 수 있는 형태로 변환
      const encodedKeyword = encodeURIComponent(keyword);

      // template literal로 URL 문자열 조립
      // q        : 검색어
      // sort     : 정렬 기준 (stars = 별점 수)
      // order    : 정렬 방향 (desc = 내림차순)
      // per_page : 결과 개수 (6개로 제한)
      const url = `https://api.github.com/search/repositories?q=${encodedKeyword}&sort=stars&order=desc&per_page=6`;

      return url;
    }

    // ② 검색 버튼 클릭 시 실행되는 함수
    function handleSearch() {
      // 입력창의 값을 가져와 앞뒤 공백 제거
      const keyword = document.getElementById('keyword-input').value.trim();

      // 검색어가 없으면 안내 메시지 표시
      if (!keyword) {
        alert('검색어를 입력해 주세요!');
        return;
      }

      // UI 초기화
      const resultsEl = document.getElementById('results');
      const loadingEl = document.getElementById('loading');
      const errorEl  = document.getElementById('error-message');

      resultsEl.innerHTML = '';    // 이전 결과 지우기
      errorEl.style.display = 'none';
      loadingEl.style.display = 'block'; // 로딩 표시

      // ③ GitHub API 호출
      const url = buildSearchUrl(keyword);

      fetch(url)
        .then(response => {
          if (!response.ok) {
            throw new Error(`API 오류: ${response.status}`);
          }
          return response.json(); // 응답을 JSON으로 변환
        })
        .then(data => {
          loadingEl.style.display = 'none'; // 로딩 숨기기

          if (data.items.length === 0) {
            errorEl.textContent = '검색 결과가 없습니다.';
            errorEl.style.display = 'block';
            return;
          }

          // ④ 결과 카드 렌더링
          data.items.forEach(repo => {
            const card = document.createElement('div');
            card.className = 'card';

            card.innerHTML = `
              <div class="card-title">
                <a href="${repo.html_url}" target="_blank">${repo.full_name}</a>
              </div>
              <p class="card-description">
                ${repo.description ? repo.description : '설명이 없습니다.'}
              </p>
              <div class="card-meta">
                <span>⭐ ${repo.stargazers_count.toLocaleString()}</span>
                <span>🌐 ${repo.language ? repo.language : '알 수 없음'}</span>
              </div>
            `;

            resultsEl.appendChild(card);
          });
        })
        .catch(error => {
          // 네트워크 오류 또는 API 오류 처리
          loadingEl.style.display = 'none';
          errorEl.textContent = `오류가 발생했습니다: ${error.message}`;
          errorEl.style.display = 'block';
        });
    }

    // Enter 키를 눌러도 검색되도록 이벤트 등록
    document.getElementById('keyword-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        handleSearch();
      }
    });
  </script>

</body>
</html>
