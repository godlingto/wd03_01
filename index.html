<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Repository Search Board</title>
  <!-- 외부 CSS 파일 연결 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 페이지 제목 영역 -->
  <header>
    <h1>🔍 GitHub Repository Search Board</h1>
    <p>검색어를 입력하면 ⭐ stars 순으로 상위 6개 저장소를 보여줍니다.</p>
  </header>

  <main>

    <!-- 검색 영역 -->
    <section class="search-section">
      <!-- 검색어 입력창 -->
      <input
        type="text"
        id="search-input"
        placeholder="검색어를 입력하세요 (예: react)"
        autocomplete="off"
      />
      <!-- 검색 버튼 -->
      <button id="search-btn">검색</button>
    </section>

    <!-- 상태 메시지 영역 (로딩 / 에러 / 안내 문구 표시) -->
    <p id="status-message"></p>

    <!-- 저장소 카드 목록을 보여줄 영역 -->
    <div id="repo-list"></div>

  </main>

  <!-- 외부 JavaScript 파일 연결 (body 끝에 배치하여 DOM 로드 후 실행) -->
  <script src="app.js"></script>

</body>
</html>
